<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi RAG</title>
  <script src="https://cdn.tailwindcss.com/3.4.17?plugins=forms"></script>
  <style>
    mark { background: #fde68a; color: inherit; border-radius: 2px; padding: 0 1px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

<header class="border-b bg-white">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
    <h1 class="text-lg font-semibold">Multi RAG</h1>
    <a href="/docs" target="_blank" class="text-sm text-slate-500 hover:text-slate-800">API docs</a>
  </div>
</header>

<main class="mx-auto grid max-w-7xl gap-6 px-4 py-6 lg:grid-cols-12">

  <!-- Left: upload + documents -->
  <section class="space-y-6 lg:col-span-4">

    <div class="rounded-xl border bg-white p-4">
      <h2 class="mb-3 font-semibold">Upload</h2>
      <form id="upload-form" class="space-y-3">
        <label id="drop-zone" class="flex cursor-pointer flex-col items-center justify-center rounded-lg border-2 border-dashed border-slate-300 px-4 py-6 text-center text-sm text-slate-500 hover:border-indigo-400 hover:bg-indigo-50/40">
          <span id="drop-label">Drop files or click to choose</span>
          <span class="mt-1 text-xs text-slate-400">PDF, PPTX, Markdown, TXT, JSON</span>
          <input id="upload-files" type="file" multiple accept=".pdf,.pptx,.md,.markdown,.txt,.json" class="hidden">
        </label>
        <div>
          <label class="mb-1 block text-xs font-medium text-slate-500">Parser</label>
          <select id="upload-parser" class="w-full rounded-lg border-slate-300 text-sm"></select>
          <p id="parser-hint" class="mt-1 text-xs text-slate-500"></p>
        </div>
        <button id="upload-btn" class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-50">Upload &amp; ingest</button>
        <p id="upload-msg" class="text-xs"></p>
      </form>
    </div>

    <div class="rounded-xl border bg-white p-4">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="font-semibold">Documents</h2>
        <button id="refresh-btn" class="text-xs text-slate-500 hover:text-slate-800">Refresh</button>
      </div>
      <p class="mb-2 text-xs text-slate-500">Tick documents to search only in them.</p>
      <ul id="doc-list" class="divide-y text-sm"></ul>
    </div>
  </section>

  <!-- Right: search + results -->
  <section class="space-y-4 lg:col-span-8">

    <div class="rounded-xl border bg-white p-4">
      <div class="mb-4 flex gap-1 rounded-lg bg-slate-100 p-1 text-sm">
        <button data-tab="text" class="tab flex-1 rounded-md px-3 py-1.5 font-medium">Text search</button>
        <button data-tab="image" class="tab flex-1 rounded-md px-3 py-1.5 font-medium">Image search</button>
      </div>

      <form id="search-form" class="space-y-4">
        <div id="text-inputs" class="space-y-3">
          <input id="query" type="text" placeholder="e.g. xgb accuracy 0.85" class="w-full rounded-lg border-slate-300 px-3 py-2.5" autocomplete="off">
          <div class="flex flex-wrap items-center gap-4 text-sm">
            <div class="flex gap-1 rounded-lg bg-slate-100 p-1">
              <label class="mode cursor-pointer rounded-md px-3 py-1"><input type="radio" name="mode" value="dense" class="hidden">Dense</label>
              <label class="mode cursor-pointer rounded-md px-3 py-1"><input type="radio" name="mode" value="hybrid" class="hidden" checked>Hybrid</label>
            </div>
            <label class="flex items-center gap-2"><input id="rerank" type="checkbox" class="rounded"> Rerank</label>
          </div>
          <p id="mode-hint" class="text-xs text-slate-500"></p>
        </div>

        <div id="image-inputs" class="hidden space-y-3">
          <div class="flex items-center gap-4">
            <label class="flex h-24 w-32 shrink-0 cursor-pointer items-center justify-center overflow-hidden rounded-lg border-2 border-dashed border-slate-300 text-xs text-slate-500 hover:border-indigo-400">
              <img id="image-preview" class="hidden h-full w-full object-contain">
              <span id="image-label">Choose image</span>
              <input id="image-file" type="file" accept="image/*" class="hidden">
            </label>
            <input id="image-query" type="text" placeholder="Optional text, e.g. revenue" class="w-full rounded-lg border-slate-300 px-3 py-2.5">
          </div>
          <p class="text-xs text-slate-500">Finds charts, tables, pages or text similar to the image (dense vectors).</p>
        </div>

        <details class="text-sm">
          <summary class="cursor-pointer text-slate-500">Options</summary>
          <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4">
            <label class="text-xs text-slate-500">Top K<input id="top-k" type="number" min="1" max="100" value="10" class="mt-1 w-full rounded-lg border-slate-300 text-sm"></label>
            <label class="text-xs text-slate-500">Candidates<input id="candidates" type="number" min="1" max="1000" value="100" class="mt-1 w-full rounded-lg border-slate-300 text-sm"></label>
            <label class="text-xs text-slate-500">Rerank top<input id="rerank-top" type="number" min="1" max="200" value="30" class="mt-1 w-full rounded-lg border-slate-300 text-sm"></label>
            <label class="text-xs text-slate-500">Parser<select id="filter-parser" class="mt-1 w-full rounded-lg border-slate-300 text-sm"><option value="">Any</option></select></label>
          </div>
          <div class="mt-3 flex gap-4 text-sm">
            <span class="text-xs text-slate-500">Modality</span>
            <label class="flex items-center gap-1"><input type="checkbox" name="modality" value="text" class="rounded"> Text</label>
            <label class="flex items-center gap-1"><input type="checkbox" name="modality" value="table" class="rounded"> Table</label>
            <label class="flex items-center gap-1"><input type="checkbox" name="modality" value="image" class="rounded"> Image</label>
          </div>
        </details>

        <div class="flex items-center justify-between gap-3">
          <p id="scope" class="text-xs text-slate-500"></p>
          <button id="search-btn" class="rounded-lg bg-indigo-600 px-5 py-2 text-sm font-medium text-white hover:bg-indigo-700 disabled:opacity-50">Search</button>
        </div>
      </form>
    </div>

    <p id="result-summary" class="px-1 text-sm text-slate-500"></p>
    <div id="results" class="space-y-3"></div>
  </section>
</main>

<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4">
  <img id="modal-img" class="max-h-full max-w-full rounded-lg bg-white">
</div>

<script>
const PARSERS = {
  fast:    "Text only. Fastest. Charts and images are skipped.",
  docling: "Layout-aware: headings and tables as Markdown.",
  vlm:     "Docling + a VLM describes every chart and figure. Best for values inside charts. Slow.",
  page:    "Every page as one image, embedded directly. No VLM.",
};
const MODE_HINTS = {
  dense:  "Meaning-based vector search. Best for charts, images and paraphrased questions.",
  hybrid: "Vectors + keyword search, fused with RRF. Best for exact terms, names and numbers.",
};
const STATUS_STYLE = {
  ready: "bg-emerald-100 text-emerald-700", pending: "bg-slate-100 text-slate-600",
  processing: "bg-amber-100 text-amber-700", failed: "bg-rose-100 text-rose-700",
};
const MODALITY_STYLE = { text: "bg-sky-100 text-sky-700", table: "bg-violet-100 text-violet-700", image: "bg-pink-100 text-pink-700" };

const $ = (id) => document.getElementById(id);
const state = { tab: "text", docs: [], jobs: {}, selected: new Set(), pollTimer: null };

const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, options = {}) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const details = body?.data?.errors?.map((e) => `${e.field}: ${e.message}`).join("; ");
    throw new Error(details || body.message || response.statusText);
  }
  return body.data;
}

// Documents

async function loadDocuments() {
  const [docs, jobs] = await Promise.all([api("/documents?limit=200"), api("/jobs?limit=200")]);
  state.docs = docs;
  state.jobs = {};
  for (const job of jobs) state.jobs[job.document_id] ??= job;   // newest first
  for (const id of [...state.selected]) if (!docs.some((d) => d.id === id)) state.selected.delete(id);
  renderDocuments();
  renderScope();

  const busy = docs.some((d) => ["pending", "processing"].includes(d.status));
  clearTimeout(state.pollTimer);
  if (busy) state.pollTimer = setTimeout(() => loadDocuments().catch(console.error), 3000);
}

function renderDocuments() {
  if (!state.docs.length) {
    $("doc-list").innerHTML = `<li class="py-6 text-center text-slate-400">No documents yet</li>`;
    return;
  }
  $("doc-list").innerHTML = state.docs.map((doc) => {
    const job = state.jobs[doc.id];
    const parserOptions = Object.keys(PARSERS).map((p) => `<option ${job?.parser === p ? "selected" : ""}>${p}</option>`).join("");
    return `
      <li class="py-3">
        <div class="flex items-start gap-2">
          <input type="checkbox" class="doc-check mt-1 rounded" data-id="${doc.id}" ${state.selected.has(doc.id) ? "checked" : ""}>
          <div class="min-w-0 flex-1">
            <p class="truncate font-medium" title="${escapeHtml(doc.filename)}">${escapeHtml(doc.filename)}</p>
            <p class="mt-0.5 flex flex-wrap items-center gap-1.5 text-xs text-slate-500">
              <span class="rounded px-1.5 py-0.5 ${STATUS_STYLE[doc.status]}" title="${escapeHtml(doc.error || "")}">${doc.status}</span>
              <span>${doc.num_chunks} chunks</span>
              ${job ? `<span>· ${job.parser}</span>` : ""}
            </p>
            ${doc.error ? `<p class="mt-1 line-clamp-2 text-xs text-rose-600">${escapeHtml(doc.error)}</p>` : ""}
            <div class="mt-2 flex items-center gap-2 text-xs">
              <a href="/documents/${doc.id}/file" target="_blank" class="text-indigo-600 hover:underline">Open</a>
              <span class="text-slate-300">|</span>
              <select class="reingest-parser rounded border-slate-300 py-0 pl-1 pr-6 text-xs" data-id="${doc.id}">${parserOptions}</select>
              <button class="reingest text-indigo-600 hover:underline" data-id="${doc.id}">Re-ingest</button>
              <span class="text-slate-300">|</span>
              <button class="delete text-rose-600 hover:underline" data-id="${doc.id}">Delete</button>
            </div>
          </div>
        </div>
      </li>`;
  }).join("");
}

$("doc-list").addEventListener("change", (e) => {
  if (!e.target.classList.contains("doc-check")) return;
  e.target.checked ? state.selected.add(e.target.dataset.id) : state.selected.delete(e.target.dataset.id);
  renderScope();
});

$("doc-list").addEventListener("click", async (e) => {
  const id = e.target.dataset.id;
  try {
    if (e.target.classList.contains("reingest")) {
      const parser = document.querySelector(`.reingest-parser[data-id="${id}"]`).value;
      await api(`/documents/${id}/ingest`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ parser }) });
      await loadDocuments();
    }
    if (e.target.classList.contains("delete")) {
      const doc = state.docs.find((d) => d.id === id);
      if (!confirm(`Delete ${doc.filename}, its chunks and stored files?`)) return;
      await api(`/documents/${id}`, { method: "DELETE" });
      await loadDocuments();
    }
  } catch (err) {
    alert(err.message);
  }
});

$("refresh-btn").addEventListener("click", () => loadDocuments().catch((e) => alert(e.message)));

function renderScope() {
  const names = state.docs.filter((d) => state.selected.has(d.id)).map((d) => d.filename);
  $("scope").textContent = names.length ? `Searching in: ${names.join(", ")}` : "Searching all documents";
}

// Upload

$("upload-parser").innerHTML = Object.keys(PARSERS).map((p) => `<option value="${p}" ${p === "vlm" ? "selected" : ""}>${p}</option>`).join("");
$("filter-parser").innerHTML += Object.keys(PARSERS).map((p) => `<option value="${p}">${p}</option>`).join("");
const showParserHint = () => ($("parser-hint").textContent = PARSERS[$("upload-parser").value]);
$("upload-parser").addEventListener("change", showParserHint);
showParserHint();

const showChosenFiles = () => {
  const files = [...$("upload-files").files];
  $("drop-label").textContent = files.length ? files.map((f) => f.name).join(", ") : "Drop files or click to choose";
};
$("upload-files").addEventListener("change", showChosenFiles);
["dragover", "drop"].forEach((type) => $("drop-zone").addEventListener(type, (e) => {
  e.preventDefault();
  if (type === "drop") { $("upload-files").files = e.dataTransfer.files; showChosenFiles(); }
}));

$("upload-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const files = [...$("upload-files").files];
  if (!files.length) return setMessage("upload-msg", "Choose a file first.", true);

  $("upload-btn").disabled = true;
  const errors = [];
  for (const [i, file] of files.entries()) {
    setMessage("upload-msg", `Uploading ${i + 1}/${files.length}: ${file.name}`);
    const form = new FormData();
    form.append("file", file);
    form.append("parser", $("upload-parser").value);
    try { await api("/documents", { method: "POST", body: form }); }
    catch (err) { errors.push(`${file.name}: ${err.message}`); }
  }
  $("upload-btn").disabled = false;
  $("upload-files").value = "";
  showChosenFiles();
  setMessage("upload-msg", errors.length ? errors.join("\n") : "Queued. Status updates below.", errors.length > 0);
  await loadDocuments().catch(console.error);
});

function setMessage(id, text, isError = false) {
  $(id).textContent = text;
  $(id).className = `whitespace-pre-line text-xs ${isError ? "text-rose-600" : "text-slate-500"}`;
}

// Search form

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tab").forEach((b) => b.className = `tab flex-1 rounded-md px-3 py-1.5 font-medium ${b.dataset.tab === tab ? "bg-white shadow-sm" : "text-slate-500"}`);
  $("text-inputs").classList.toggle("hidden", tab !== "text");
  $("image-inputs").classList.toggle("hidden", tab !== "image");
  $("rerank-top").closest("label").classList.toggle("hidden", tab !== "text");
}
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", (e) => { e.preventDefault(); setTab(b.dataset.tab); }));

function syncMode() {
  const mode = document.querySelector("input[name=mode]:checked").value;
  document.querySelectorAll(".mode").forEach((l) => l.className = `mode cursor-pointer rounded-md px-3 py-1 ${l.querySelector("input").checked ? "bg-white shadow-sm font-medium" : "text-slate-500"}`);
  $("mode-hint").textContent = MODE_HINTS[mode] + ($("rerank").checked ? " Rerank re-scores the top results with a cross-encoder." : "");
}
document.querySelectorAll("input[name=mode], #rerank").forEach((el) => el.addEventListener("change", syncMode));

$("image-file").addEventListener("change", () => {
  const file = $("image-file").files[0];
  $("image-preview").classList.toggle("hidden", !file);
  $("image-label").classList.toggle("hidden", !!file);
  if (file) $("image-preview").src = URL.createObjectURL(file);
});

function filters() {
  const modalities = [...document.querySelectorAll("input[name=modality]:checked")].map((c) => c.value);
  const result = {};
  if (state.selected.size) result.document_ids = [...state.selected];
  if (modalities.length) result.modalities = modalities;
  if ($("filter-parser").value) result.parser = $("filter-parser").value;
  return result;
}

$("search-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const topK = Number($("top-k").value), candidates = Number($("candidates").value);
  let request, query;

  if (state.tab === "text") {
    query = $("query").value.trim();
    if (!query) return $("query").focus();
    request = api("/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query, top_k: topK, candidates,
        mode: document.querySelector("input[name=mode]:checked").value,
        rerank: $("rerank").checked,
        rerank_top: Number($("rerank-top").value),
        filters: filters(),
      }),
    });
  } else {
    const file = $("image-file").files[0];
    if (!file) return alert("Choose an image first.");
    query = $("image-query").value.trim();
    const form = new FormData();
    form.append("file", file);
    if (query) form.append("query", query);
    form.append("top_k", topK);
    form.append("candidates", candidates);
    form.append("filters", JSON.stringify(filters()));
    request = api("/search/image", { method: "POST", body: form });
  }

  $("search-btn").disabled = true;
  $("search-btn").textContent = "Searching…";
  $("result-summary").textContent = "";
  try {
    renderResults(await request, query);
  } catch (err) {
    $("results").innerHTML = `<div class="rounded-xl border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700">${escapeHtml(err.message)}</div>`;
  } finally {
    $("search-btn").disabled = false;
    $("search-btn").textContent = "Search";
  }
});

// Results

function highlight(text, query) {
  const html = escapeHtml(text);
  const terms = [...new Set((query.match(/[\p{L}\p{N}][\p{L}\p{N}.%_-]*/gu) || []).filter((t) => t.length > 1))];
  if (!terms.length) return html;
  const pattern = new RegExp(`(${terms.map((t) => escapeHtml(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "giu");
  return html.replace(pattern, "<mark>$1</mark>");
}

function scoreLabel(result) {
  if (result.reranked) return "rerank score";
  return result.mode === "dense" ? "cosine" : "RRF score";
}

function renderResults(result, query) {
  const label = scoreLabel(result);
  const method = result.reranked ? `${result.mode} + rerank` : result.mode;
  $("result-summary").textContent = `${result.hits.length} results · ${method} · ${Math.round(result.took_ms)} ms`;

  if (!result.hits.length) {
    $("results").innerHTML = `<div class="rounded-xl border bg-white p-8 text-center text-sm text-slate-400">No results. Try hybrid mode, fewer filters, or check the document finished ingesting.</div>`;
    return;
  }

  $("results").innerHTML = result.hits.map((hit, i) => {
    const isPdf = hit.filename.toLowerCase().endsWith(".pdf");
    const fileUrl = `/documents/${hit.document_id}/file${isPdf && hit.page ? `#page=${hit.page}` : ""}`;
    const ranks = [
      hit.dense_rank && `dense #${hit.dense_rank}`,
      hit.fulltext_rank && `keyword #${hit.fulltext_rank}`,
      hit.sparse_rank && `sparse #${hit.sparse_rank}`,
    ].filter(Boolean).join(" · ");
    const content = hit.content?.trim() ? highlight(hit.content, query || "") : `<span class="italic text-slate-400">No text: matched by the image.</span>`;

    return `
      <article class="rounded-xl border bg-white p-4">
        <header class="flex flex-wrap items-center gap-2 text-sm">
          <span class="font-mono text-xs text-slate-400">#${i + 1}</span>
          <a href="${fileUrl}" target="_blank" class="font-medium hover:text-indigo-600 hover:underline">${escapeHtml(hit.filename)}</a>
          ${hit.page ? `<span class="rounded bg-slate-100 px-1.5 py-0.5 text-xs">page ${hit.page}</span>` : ""}
          <span class="rounded px-1.5 py-0.5 text-xs ${MODALITY_STYLE[hit.modality]}">${hit.modality}</span>
          ${hit.parser ? `<span class="rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-500">${hit.parser}</span>` : ""}
          <span class="ml-auto text-xs text-slate-500">${label} <b class="font-mono text-slate-800">${hit.score.toFixed(4)}</b></span>
        </header>
        ${hit.heading_path?.length ? `<p class="mt-1 truncate text-xs text-slate-400">${hit.heading_path.map(escapeHtml).join(" › ")}</p>` : ""}
        ${hit.json_path ? `<p class="mt-1 font-mono text-xs text-slate-400">${escapeHtml(hit.json_path)}</p>` : ""}

        <div class="mt-3 flex flex-col gap-4 sm:flex-row">
          ${hit.image_url ? `
            <button class="zoom shrink-0 overflow-hidden rounded-lg border bg-slate-50 sm:w-56" data-src="${escapeHtml(hit.image_url)}">
              <img src="${escapeHtml(hit.image_url)}" loading="lazy" class="max-h-56 w-full object-contain" onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'p-4 text-xs text-slate-400',textContent:'Image unavailable'}))">
            </button>` : ""}
          <div class="min-w-0 flex-1">
            <div class="content line-clamp-6 whitespace-pre-wrap break-words text-sm leading-relaxed ${hit.modality === "table" ? "font-mono text-xs" : ""}">${content}</div>
            <div class="mt-2 flex flex-wrap items-center gap-3 text-xs">
              <button class="toggle text-indigo-600 hover:underline">Show more</button>
              <a href="${fileUrl}" target="_blank" class="text-indigo-600 hover:underline">${isPdf && hit.page ? `Open page ${hit.page}` : "Open file"}</a>
              ${ranks ? `<span class="text-slate-400">${ranks}</span>` : ""}
            </div>
          </div>
        </div>
      </article>`;
  }).join("");
}

$("results").addEventListener("click", (e) => {
  const zoom = e.target.closest(".zoom");
  if (zoom) {
    $("modal-img").src = zoom.dataset.src;
    $("modal").classList.replace("hidden", "flex");
  }
  if (e.target.classList.contains("toggle")) {
    const content = e.target.closest("article").querySelector(".content");
    const expanded = content.classList.toggle("line-clamp-6") === false;
    e.target.textContent = expanded ? "Show less" : "Show more";
  }
});
$("modal").addEventListener("click", () => $("modal").classList.replace("flex", "hidden"));

setTab("text");
syncMode();
loadDocuments().catch((e) => setMessage("upload-msg", `Could not load documents: ${e.message}`, true));
</script>
</body>
</html>
